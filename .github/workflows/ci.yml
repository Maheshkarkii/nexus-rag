name: AI Research Assistant CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-quality-and-tests:
    name: Backend Lint, Type Check & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio pytest-cov
          pip install -r backend/requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check backend/app

      - name: Execute Pytest Suite (Services, Evaluation, Security, Jobs)
        working-directory: ./backend
        run: |
          pytest tests/services tests/evaluation tests/security tests/jobs --cov=app --cov-report=xml

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage.xml

  frontend-quality-and-build:
    name: Frontend Lint, Type Check & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Next.js Linter
        working-directory: ./frontend
        run: npm run lint

      - name: Execute Production Frontend Build
        working-directory: ./frontend
        run: npm run build

  security-and-secret-scanning:
    name: Security Regression & Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Security Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov
          pip install -r backend/requirements.txt

      - name: Run Stage 25 Security Regression Tests
        working-directory: ./backend
        run: |
          pytest tests/security

  docker-validation:
    name: Docker Compose Validation & Container Builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build Backend Production Container
        run: |
          docker build -t ai-research-backend:latest ./backend

      - name: Build Frontend Production Container
        run: |
          docker build -t ai-research-frontend:latest ./frontend
