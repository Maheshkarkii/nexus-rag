services:
  - type: web
    name: nexus-rag-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: PREWARM_MODELS
        value: "false"
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: LLM_API_KEY
        sync: false
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: TORCH_NUM_THREADS
        value: "1"

