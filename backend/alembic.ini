# ==============================================================================
# AI Research Assistant — Alembic Database Migration Configuration
# ==============================================================================

[alembic]
# Path to migration environment scripts
script_location = alembic

# Template used to generate migration files
file_template = %%(rev)s_%%(slug)s

# Prepend current directory to sys.path so app modules can be resolved
prepend_sys_path = .

# Timezone used for timestamps in generated migration files
timezone = UTC

# Maximum line length for python files generated by autogenerate
truncate_slug_length = 40

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
